<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Reportes PDF - Evaluación del Estrés</title>
    <link rel="icon" type="image/x-icon" href="/cuestionarios/assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/cuestionarios/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            overflow-y: auto !important;
        }

        .pdf-generator-app {
            min-height: 100vh;
            padding: var(--spacing-xl);
            max-width: 1200px;
            margin: 0 auto;
        }

        .pdf-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
            padding: var(--spacing-xl);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }

        .pdf-icon {
            font-size: 3rem;
            margin-bottom: var(--spacing-md);
        }

        .pdf-title {
            font-size: var(--font-size-3xl);
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .pdf-subtitle {
            color: var(--text-secondary);
            font-size: var(--font-size-lg);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-xs);
            color: var(--primary-color);
            text-decoration: none;
            font-size: var(--font-size-sm);
            margin-bottom: var(--spacing-lg);
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .search-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: var(--spacing-xl);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
        }

        .search-section h2 {
            font-size: var(--font-size-xl);
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-lg);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .search-box {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .search-box input {
            flex: 1;
            padding: var(--spacing-md) var(--spacing-lg);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: var(--font-size-md);
            font-family: var(--font-family);
            transition: all var(--transition-fast);
            background: var(--bg-main);
            color: var(--text-primary);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .btn {
            padding: var(--spacing-md) var(--spacing-xl);
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--font-size-md);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-family: var(--font-family);
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        .actions-section {
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .results-info {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(124, 58, 237, 0.1));
            border-left: 4px solid var(--primary-color);
            padding: var(--spacing-lg);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
        }

        .results-info p {
            margin: var(--spacing-xs) 0;
            color: var(--text-primary);
            font-weight: 500;
        }

        .response-card {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
            transition: all var(--transition-fast);
        }

        .response-card:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .response-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing-md);
        }

        .response-info {
            flex: 1;
        }

        .cedula-badge {
            background: var(--primary-gradient);
            color: white;
            padding: var(--spacing-sm) var(--spacing-lg);
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: var(--font-size-md);
            display: inline-block;
            margin-bottom: var(--spacing-xs);
        }

        .date-text {
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
        }

        .response-actions {
            display: flex;
            gap: var(--spacing-sm);
        }

        .btn-small {
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: var(--font-size-sm);
        }

        .loading {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--text-secondary);
        }

        .spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto var(--spacing-md);
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border-left: 4px solid #ef4444;
            padding: var(--spacing-lg);
            border-radius: var(--radius-md);
            color: #dc2626;
            margin-bottom: var(--spacing-md);
        }

        .success {
            background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid #10b981;
            padding: var(--spacing-lg);
            border-radius: var(--radius-md);
            color: #059669;
            margin-bottom: var(--spacing-md);
        }

        @media (max-width: 768px) {
            .pdf-generator-app {
                padding: var(--spacing-md);
            }

            .pdf-title {
                font-size: var(--font-size-xl);
            }

            .search-box {
                flex-direction: column;
            }

            .actions-section {
                flex-direction: column;
            }

            .response-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        /* === ESTILOS GESTIÓN DE PDFS (DEFINITIVO) === */

        /* Contenedor tipo Tarjeta */
        .manage-pdfs-section {
            background-color: #ffffff !important;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            margin-top: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: block;
        }

        .manage-pdfs-section.hidden {
            display: none !important;
        }

        /* Cabecera */
        .manage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            gap: var(--spacing-md);
        }

        .manage-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        /* Controles */
        .table-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .bulk-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding-left: 1rem;
            border-left: 1px solid var(--border-color);
            opacity: 0.5;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .bulk-actions.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Tabla */
        .table-container {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #fff;
        }

        .file-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        .file-table th {
            background-color: #f8fafc;
            font-weight: 600;
            text-align: left;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .file-table td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            vertical-align: middle;
        }

        .file-table tr:last-child td {
            border-bottom: none;
        }

        .file-table tr:hover {
            background-color: #f1f5f9;
        }

        /* Checkbox y Acciones */
        .checkbox-cell {
            width: 40px;
            text-align: center;
        }

        .file-actions {
            display: flex;
            gap: 0.5rem;
        }
    </style>
</head>

<body>
    <!-- Background Animation -->
    <div class="bg-animation">
        <div class="bg-gradient"></div>
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
        </div>
    </div>

    <div class="pdf-generator-app">
        <a href="/cuestionarios/resultados-dashboard" class="back-link">
            ← Volver al Dashboard
        </a>

        <div class="pdf-header">
            <div class="pdf-icon">🖨️</div>
            <h1 class="pdf-title">Generar Reportes PDF</h1>
            <p class="pdf-subtitle">Cuestionario para la Evaluación del Estrés</p>
        </div>

        <!-- Sección de búsqueda -->
        <div class="search-section">
            <h2>🔍 Buscar por Cédula</h2>
            <div class="search-box">
                <input type="text" id="cedulaInput" placeholder="Ingrese el número de cédula..."
                    onkeypress="if(event.key === 'Enter') searchByCedula()">
                <button class="btn btn-primary" onclick="searchByCedula()">
                    🔍 Buscar
                </button>
            </div>
            <div id="searchResults"></div>
        </div>

        <!-- Sección de acciones generales -->
        <div class="search-section">
            <h2>📄 Acciones Generales</h2>
            <div class="actions-section">
                <button class="btn btn-secondary" onclick="loadAllResponses()">
                    📋 Ver Todas las Respuestas
                </button>
                <button class="btn btn-danger" onclick="generateAllPDFs()">
                    🖨️ Generar PDFs de Todos
                </button>
                <button class="btn btn-secondary" onclick="togglePDFSection()" style="background: var(--text-primary);">
                    📂 Ver PDFs Generados
                </button>
            </div>
            <div id="progressContainer" style="display: none; margin-top: var(--spacing-lg);">
                <div class="results-info" style="border-left-color: var(--primary-color);">
                    <p id="progressText">Generando PDFs: 0%</p>
                    <div
                        style="width: 100%; height: 10px; background: #eee; border-radius: 5px; margin-top: 10px; overflow: hidden;">
                        <div id="progressBar"
                            style="width: 0%; height: 100%; background: var(--primary-color); transition: width 0.3s;">
                        </div>
                    </div>
                </div>
            </div>
            <div id="allResponsesContainer" style="margin-top: var(--spacing-lg);"></div>
        </div>
        <!-- Sección de Gestión de PDFs (Tabla Avanzada) -->
        <div class="manage-pdfs-section hidden">
            <div class="manage-header">
                <div class="manage-title">
                    📂 Gestionar Archivos de Reporte
                </div>
                <div class="table-controls">
                    <button class="btn btn-secondary btn-small" onclick="loadPDFList()">
                        🔄 Refrescar Lista
                    </button>
                    <div id="bulkActions" class="bulk-actions">
                        <button class="btn btn-primary btn-small" onclick="downloadSelected()">
                            ⬇️ Descargar Seleccionados (ZIP)
                        </button>
                        <button class="btn btn-danger btn-small" onclick="deleteSelected()"
                            style="background: #dc2626;">
                            🗑️ Borrar Seleccionados
                        </button>
                    </div>
                </div>
            </div>

            <div class="table-container">
                <div id="pdfListContainer"></div>
            </div>
            <div id="selectionStatus" style="margin-top: 10px; color: var(--text-secondary); font-size: 0.9em;">
                0 archivos seleccionados
            </div>
        </div>
    </div>

    <!-- Template oculto para generación de PDF -->
    <iframe id="pdfFrame" style="display: none;"></iframe>



    <script>
        // Detect base URL for API calls
        const getApiBaseUrl = () => {
            const path = window.location.pathname;
            if (path.startsWith('/cuestionarios_brp')) return '/cuestionarios_brp';
            if (path.startsWith('/cuestionarios')) return '/cuestionarios';
            return '';
        };
        const API_BASE_URL = getApiBaseUrl();
        let allResponses = [];
        let questionnaireData = null;

        // Cargar datos del cuestionario
        async function loadQuestionnaireData() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/questionnaires/estres`);
                questionnaireData = await response.json();
            } catch (error) {
                console.error('Error loading questionnaire:', error);
            }
        }

        // Buscar por cédula
        async function searchByCedula() {
            const cedula = document.getElementById('cedulaInput').value.trim();
            const resultsContainer = document.getElementById('searchResults');

            if (!cedula) {
                resultsContainer.innerHTML = '<div class="error">Por favor ingrese un número de cédula.</div>';
                return;
            }

            resultsContainer.innerHTML = '<div class="loading"><div class="spinner"></div>Buscando...</div>';

            try {
                const response = await fetch(`${API_BASE_URL}/api/responses/estres`);
                const responseData = await response.json();
                const allData = responseData.responses;

                const userResponse = allData.find(r => r.respondent_cedula === cedula);

                if (userResponse) {
                    resultsContainer.innerHTML = `
                        <div class="success">✅ Usuario encontrado</div>
                        ${renderResponseCard(userResponse)}
                    `;
                } else {
                    resultsContainer.innerHTML = `<div class="error">❌ No se encontraron resultados para la cédula: ${cedula}</div>`;
                }
            } catch (error) {
                resultsContainer.innerHTML = `<div class="error">Error al buscar: ${error.message}</div>`;
            }
        }

        // Cargar todas las respuestas
        async function loadAllResponses() {
            // Ocultar sección de PDFs si está visible
            const pdfSection = document.querySelector('.manage-pdfs-section');
            if (pdfSection) pdfSection.classList.add('hidden');

            const container = document.getElementById('allResponsesContainer');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Cargando respuestas...</div>';

            try {
                const response = await fetch(`${API_BASE_URL}/api/responses/estres`);
                const responseData = await response.json();
                allResponses = responseData.responses;

                if (allResponses.length === 0) {
                    container.innerHTML = '<div class="error">No hay respuestas disponibles.</div>';
                    return;
                }

                let html = `<div class="results-info">
                    <p><strong>Total de respuestas:</strong> ${allResponses.length}</p>
                </div>`;

                allResponses.forEach(response => {
                    html += renderResponseCard(response);
                });

                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `<div class="error">Error al cargar respuestas: ${error.message}</div>`;
            }
        }

        // Renderizar tarjeta de respuesta
        function renderResponseCard(response) {
            const date = new Date(response.submitted_at).toLocaleString('es-CO');

            return `
                <div class="response-card">
                    <div class="response-header">
                        <div class="response-info">
                            <div class="cedula-badge">CC: ${response.respondent_cedula}</div>
                            <div class="date-text">${date}</div>
                        </div>
                        <div class="response-actions">
                            <button class="btn btn-primary btn-small" onclick='generatePDF(${JSON.stringify(response)})'>
                                🖨️ Imprimir
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Generar PDF individual
        function generatePDF(responseData) {
            const iframe = document.getElementById('pdfFrame');
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

            // Generar el HTML del reporte
            const reportHTML = generateReportHTML(responseData);

            // Cargar el HTML en el iframe
            iframeDoc.open();
            iframeDoc.write(reportHTML);
            iframeDoc.close();

            // Esperar a que el iframe cargue e imprimir
            iframe.onload = function () {
                setTimeout(() => {
                    iframe.contentWindow.print();
                }, 500);
            };
        }

        // Convierte una URL de imagen a base64 data URI
        async function imgToBase64(url) {
            const res = await fetch(url);
            const blob = await res.blob();
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        }

        // Generar PDF en el servidor (Playwright = idéntico a imprimir desde el navegador)
        async function generateAndSavePDFToServer(responseData) {
            // Generar el HTML del reporte
            let reportHTML = generateReportHTML(responseData);

            // Convertir imágenes a base64 para que Playwright no necesite acceder a URLs externas
            const colombiaB64 = await imgToBase64('/cuestionarios/escudo_colombia.png');
            const javerianaB64 = await imgToBase64('/cuestionarios/logo_javeriana.png');
            reportHTML = reportHTML
                .replace(/src="\/cuestionarios\/escudo_colombia\.png"/g, `src="${colombiaB64}"`)
                .replace(/src="\/cuestionarios\/logo_javeriana\.png"/g, `src="${javerianaB64}"`);

            const filename = `Reporte_Estres_${responseData.respondent_cedula}.pdf`;

            const response = await fetch(`${API_BASE_URL}/api/generate-pdf-server`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ html: reportHTML, filename })
            });

            if (!response.ok) {
                const err = await response.text();
                throw new Error(`Error del servidor: ${err}`);
            }

            const result = await response.json();
            return result.success;
        }

        // Generar todos los PDFs y guardarlos en el servidor
        async function generateAllPDFs() {
            // Si no hay respuestas cargadas, cargarlas primero
            if (allResponses.length === 0) {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/responses/estres`);
                    const responseData = await response.json();
                    allResponses = responseData.responses;

                    if (allResponses.length === 0) {
                        alert('No hay respuestas disponibles para generar reportes.');
                        return;
                    }
                } catch (error) {
                    alert('Error al cargar las respuestas: ' + error.message);
                    return;
                }
            }

            if (!confirm(`¿Está seguro de generar y guardar ${allResponses.length} reportes PDF directamente en el servidor? \n\nUbicación: backend/data/resultados_pdf/`)) {
                return;
            }

            // Mostrar progreso
            const progressContainer = document.getElementById('progressContainer');
            const progressText = document.getElementById('progressText');
            const progressBar = document.getElementById('progressBar');

            progressContainer.style.display = 'block';
            let successCount = 0;

            // Generar uno por uno (sin delay, el servidor es rápido)
            for (let i = 0; i < allResponses.length; i++) {
                try {
                    const percent = Math.round(((i + 1) / allResponses.length) * 100);
                    progressText.innerText = `Generando y guardando PDFs: ${percent}% (${i + 1}/${allResponses.length})`;
                    progressBar.style.width = `${percent}%`;

                    await generateAndSavePDFToServer(allResponses[i]);
                    successCount++;
                } catch (error) {
                    console.error(`Error en respuesta ${i}:`, error);
                }
            }

            progressText.innerText = `✅ ¡Completado! Se guardaron ${successCount} reportes en el servidor.`;
            alert(`Se han generado y guardado ${successCount} reportes PDF en la carpeta del servidor.`);
        }


        // Generar HTML del reporte
        function generateReportHTML(responseData) {
            const questions = [
                { id: 1, text: "Dolores en el cuello y espalda o tensión muscular." },
                { id: 2, text: "Problemas gastrointestinales, úlcera péptica, acidez, problemas digestivos o del colon." },
                { id: 3, text: "Problemas respiratorios." },
                { id: 4, text: "Dolor de cabeza." },
                { id: 5, text: "Trastornos del sueño como somnolencia durante el día o desvelo en la noche." },
                { id: 6, text: "Palpitaciones en el pecho o problemas cardíacos." },
                { id: 7, text: "Cambios fuertes del apetito." },
                { id: 8, text: "Problemas relacionados con la función de los órganos genitales (impotencia, frigidez)." },
                { id: 9, text: "Dificultad en las relaciones familiares." },
                { id: 10, text: "Dificultad para permanecer quieto o dificultad para iniciar actividades." },
                { id: 11, text: "Dificultad en las relaciones con otras personas." },
                { id: 12, text: "Sensación de aislamiento y desinterés." },
                { id: 13, text: "Sentimiento de sobrecarga de trabajo." },
                { id: 14, text: "Dificultad para concentrarse, olvidos frecuentes." },
                { id: 15, text: "Aumento en el número de accidentes de trabajo." },
                { id: 16, text: "Sentimiento de frustración, de no haber hecho lo que se quería en la vida." },
                { id: 17, text: "Cansancio, tedio o desgano." },
                { id: 18, text: "Disminución del rendimiento en el trabajo o poca creatividad." },
                { id: 19, text: "Deseo de no asistir al trabajo." },
                { id: 20, text: "Bajo compromiso o poco interés con lo que se hace." },
                { id: 21, text: "Dificultad para tomar decisiones." },
                { id: 22, text: "Deseo de cambiar de empleo." },
                { id: 23, text: "Sentimiento de soledad y miedo." },
                { id: 24, text: "Sentimiento de irritabilidad, actitudes y pensamientos negativos." },
                { id: 25, text: "Sentimiento de angustia, preocupación o tristeza." },
                { id: 26, text: "Consumo de drogas para aliviar la tensión o los nervios." },
                { id: 27, text: 'Sentimientos de que "no vale nada" o "no sirve para nada".' },
                { id: 28, text: "Consumo de bebidas alcohólicas o café o cigarrillo." },

        // === GESTIÓN DE PDFs EN SERVIDOR (TABLA AVANZADA) ===

        let serverFiles = []; // Almacena la lista de archivos recien cargada

        function togglePDFSection() {
            const section = document.querySelector('.manage-pdfs-section');
            const responsesDiv = document.getElementById('allResponsesContainer');
            if (responsesDiv) responsesDiv.innerHTML = ''; // Limpiar respuestas

            section.classList.toggle('hidden');

            if (!section.classList.contains('hidden')) {
                loadPDFList();
                section.scrollIntoView({ behavior: 'smooth' });
            }
        }

        async function loadPDFList() {
            const container = document.getElementById('pdfListContainer');
            if (container) {
                container.innerHTML = '<div class="loading"><div class="spinner"></div>Cargando archivos...</div>';
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/pdfs/stress`);
                serverFiles = await response.json();

                if (!container) return;

                if (serverFiles.length === 0) {
                    container.innerHTML = '<div class="error">No hay archivos PDF generados aún.</div>';
                    return;
                }

                let html = `
                    <table class="file-table">
                        <thead>
                            <tr>
                                <th class="checkbox-cell">
                                    <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)">
                                </th>
                                <th>Archivo</th>
                                <th>Fecha</th>
                                <th>Tamaño</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                serverFiles.forEach((file, index) => {
                    html += `
                        <tr id="row-${index}">
                            <td class="checkbox-cell">
                                <input type="checkbox" class="file-checkbox" value="${file.filename}" onchange="updateSelection()">
                            </td>
                            <td>📄 ${file.filename}</td>
                            <td>${file.created_at}</td>
                            <td>${file.size_kb} KB</td>
                            <td>
                                <div class="file-actions">
                                    <button class="btn btn-primary btn-small" onclick="downloadServerPDF('${file.filename}')">
                                        ⬇️
                                    </button>
                                    <button class="btn btn-danger btn-small" onclick="deleteServerPDF('${file.filename}')" style="background: #dc2626;">
                                        🗑️
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                container.innerHTML = html;
                updateSelection(); // Reset buttons

            } catch (error) {
                if (container) container.innerHTML = `<div class="error">Error al cargar lista: ${error.message}</div>`;
            }
        }

        // Selección Masiva
        function toggleSelectAll(source) {
            const checkboxes = document.querySelectorAll('.file-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = source.checked;
            });
            updateSelection();
        }

        function updateSelection() {
            const checkboxes = document.querySelectorAll('.file-checkbox:checked');
            const count = checkboxes.length;

            // Actualizar texto
            const statusDiv = document.getElementById('selectionStatus');
            if (statusDiv) statusDiv.innerText = `${count} archivos seleccionados`;

            // Activar botones bulk
            const bulkDiv = document.getElementById('bulkActions');
            if (bulkDiv) {
                if (count > 0) {
                    bulkDiv.classList.add('active');
                } else {
                    bulkDiv.classList.remove('active');
                }
            }

            // Resaltar filas
            document.querySelectorAll('.file-checkbox').forEach(cb => {
                const row = cb.closest('tr');
                if (cb.checked) row.classList.add('selected-row');
                else row.classList.remove('selected-row');
            });
        }

        function getSelectedFilenames() {
            const checkboxes = document.querySelectorAll('.file-checkbox:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        // Acciones Individuales
        async function downloadServerPDF(filename) {
            window.location.href = `${API_BASE_URL}/api/pdfs/stress/${filename}`;
        }

        async function deleteServerPDF(filename) {
            if (!confirm(`¿Borrar "${filename}"?`)) return;
            try {
                await fetch(`${API_BASE_URL}/api/pdfs/stress/${filename}`, { method: 'DELETE' });
                loadPDFList();
            } catch (e) { alert(e.message); }
        }

        // Acciones Masivas
        async function downloadSelected() {
            const selected = getSelectedFilenames();
            if (selected.length === 0) return;

            if (selected.length === 1) {
                downloadServerPDF(selected[0]);
                return;
            }

            // Descargar ZIP
            try {
                const button = document.querySelector('#bulkActions button.btn-primary');
                const originalText = button.innerText;
                button.innerText = "⏳ Comprimiendo...";

                const response = await fetch(`${API_BASE_URL}/api/pdfs/stress/bulk-download`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(selected)
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `reportes_estres_seleccionados.zip`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                } else {
                    alert('Error al generar ZIP');
                }
                button.innerText = originalText;
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function deleteSelected() {
            const selected = getSelectedFilenames();
            if (selected.length === 0) return;

            if (!confirm(`¿Estás seguro de BORRAR ${selected.length} archivos seleccionados? esta acción no se puede deshacer.`)) return;

            try {
                const response = await fetch(`${API_BASE_URL}/api/pdfs/stress/bulk-delete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(selected)
                });

                const result = await response.json();
                loadPDFList();
                alert(`Eliminados: ${result.deleted_count} archivos.`);
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            loadQuestionnaireData();
        });
    </script>
